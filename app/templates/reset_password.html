<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050510">
<title>Wadi — إعادة تعيين كلمة المرور</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
<div class="stars" id="stars"></div>
<div class="card">
  <div class="logo"><img src="{{ url_for('static', filename='images/logo.png') }}" alt="Wadi" class="logo-img"> <span class="logo-text">Wadi</span></div>
  <div class="subtitle"><i class="fa-solid fa-key"></i> إعادة تعيين كلمة المرور</div>

  {% if error %}
  <div class="error-msg"><i class="fa-solid fa-triangle-exclamation"></i> {{ error }}</div>
  {% endif %}

  {% if invalid %}
  <div class="error-msg"><i class="fa-solid fa-triangle-exclamation"></i> رابط الاسترداد غير صالح أو منتهي الصلاحية أو مُستخدَم من قبل. اطلب رابطاً جديداً من المسؤول.</div>
  <a href="/login" class="btn" style="display:block;text-align:center;text-decoration:none;margin-top:16px">
    <i class="fa-solid fa-right-to-bracket"></i> رجوع لتسجيل الدخول
  </a>
  {% else %}
  <form class="form" method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="input-group">
      <i class="fa-solid fa-lock"></i>
      <input type="password" name="password" placeholder="كلمة المرور الجديدة (6 أحرف على الأقل)" required minlength="6" autofocus>
    </div>
    <div class="input-group">
      <i class="fa-solid fa-lock"></i>
      <input type="password" name="confirm" placeholder="تأكيد كلمة المرور" required minlength="6">
    </div>
    <button type="submit" class="btn">
      <i class="fa-solid fa-key"></i> تغيير كلمة المرور
    </button>
  </form>
  {% endif %}
</div>

<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
